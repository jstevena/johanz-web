###############################################
# Common Keys
###############################################
x-common-keys: &common-keys
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    - PUID=1000
    - PGID=1000
    - TZ=Asia/Jakarta

services:

###############################################
# JOHANZ WEB (NGINX)
###############################################
  johanz-web:
    <<: *common-keys
    container_name: johanz-web
    image: nginx:alpine
    cpus: 0.10
    mem_limit: 64m
    ports:
      - "172.19.0.1:8077:80" # Bind ke IP Gateway
    volumes:
      - ./appdata/html:/usr/share/nginx/html:ro
      - ./appdata/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

###############################################
# WRITEFREELY (BLOG)
###############################################
  writefreely:
    <<: *common-keys
    container_name: writefreely
    image: writeas/writefreely:latest
    cpus: 0.25
    mem_limit: 128m
    ports:
      - "172.19.0.1:8078:8080"
    volumes:
      - ./appdata/writefreely/config.ini:/go/config.ini
      - ./appdata/writefreely/keys:/go/keys
      - ./appdata/writefreely/data:/go/data

###############################################
# Dedicated Network
###############################################
networks:
  default:
    name: johan_web
    ipam:
      config:
        - subnet: 172.19.0.0/16
<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>404 Not Found</title>
  <link rel="icon" type="image/png" href="https://johanz.my.id/assets/errors/huh.png">
  <!-- YNTKTS -->
  <meta http-equiv="refresh" content="5;url=https://www.youtube.com/watch?v=4K5sK4Pl53s">
  
  <!-- CSS (Mengambil style utama dari root & style khusus error) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="https://johanz.my.id/style.css" />
<link rel="stylesheet" href="https://johanz.my.id/error.css" />
</head>
<body>

  <!-- ── Theme Toggle ── -->
  <div class="toggle-wrap">
    <span class="toggle-label" id="toggle-label">Dark</span>
    <button class="toggle" id="theme-toggle" aria-label="Toggle light/dark mode" onclick="toggleTheme()"></button>
    <span class="toggle-icon" id="toggle-icon">🌙</span>
  </div>

  <!-- ── Main Card ── -->
  <div class="card error-card">
    <div class="error-img-wrap">
      <img src="https://johanz.my.id/assets/errors/yntkts.jpg" alt="404 Not Found">
    </div>
    <h1 class="name">404 Not Found</h1>
    <p class="tagline">Redirecting...</p>
    <div class="loader"></div>
  </div>

  <script src="https://johanz.my.id/main.js"></script>
</body>
</html>
